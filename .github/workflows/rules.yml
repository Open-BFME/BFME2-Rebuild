name: BFME II source rules

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  repository_dispatch:
    types: [bfme-remeasure]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions: {}

concurrency:
  group: >-
    bfme-source-rules-${{ (github.event_name == 'pull_request_target' && github.event.action == 'edited' &&
      github.event.changes.base.ref.from == null && format('metadata-{0}', github.run_id)) ||
      (github.event_name == 'merge_group' && format('queue-{0}', github.sha)) ||
      (github.event_name == 'repository_dispatch' && format('remeasure-{0}-{1}-{2}',
        github.event.client_payload.number, github.event.client_payload.head,
        github.event.client_payload.base)) || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_TOOLS_SHA: ${{ github.event_name != 'merge_group' && github.sha || github.event.merge_group.base_sha }}

jobs:
  source-rules:
    if: >-
      github.repository_id == '1464323350' &&
      (vars.BFME_PR_COMPACT != 'yes' || github.event_name == 'merge_group') &&
      !(github.event_name == 'pull_request_target' && github.event.action == 'edited' &&
        github.event.changes.base.ref.from == null) &&
      ((github.event_name != 'merge_group' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'merge_group' && vars.BFME_MERGE_QUEUE_ENABLED == 'yes' &&
        github.event.merge_group.base_ref == 'refs/heads/main'))
    runs-on: ${{ (vars.BFME_PR_ORCHESTRATION_RUNNER || 'ubuntu-24.04') }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.evaluate.outputs.status }}
    steps:
      - name: Verify the protected tools revision
        env:
          QUEUE_READ_TOKEN: ${{ github.event_name == 'merge_group' && github.token || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected an exact protected commit. Found a missing or invalid revision." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            if [[ "${GITHUB_REPOSITORY,,}" != open-bfme/bfme2-rebuild ||
                  "$GITHUB_SERVER_URL" != https://github.com ||
                  "$GITHUB_API_URL" != https://api.github.com ]]; then
              echo "Expected the GitHub source repository. Found a different repository or service." >&2
              exit 1
            fi
            if ! main=$(curl --fail --silent --proto '=https' --connect-timeout 8 --max-time 25 \
                  --config - "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
                  <<< "header = \"Authorization: Bearer $QUEUE_READ_TOKEN\"" | jq -er '.object.sha') ||
                [[ "$SOURCE_TOOLS_SHA" != "$main" ]]; then
              echo "Expected the queued change's base to be current protected main. Found a moved or unavailable main." >&2
              exit 1
            fi
          fi

      - name: Load the source checks from protected main
        id: trusted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_TOOLS_SHA }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: tools/gates
          path: source-rule-tools

      - name: Confirm the current change and repository visibility
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B source-rule-tools/tools/gates/workflow.py authorize

      - name: Fetch public Git objects without credentials
        if: steps.authorize.outputs.transport == 'public'
        id: fetch-public
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            SOURCE_TRANSPORT=public \
            python3 -I -S -B source-rule-tools/tools/gates/workflow.py fetch

      - name: Receive same-repository changes in the private repository
        if: steps.authorize.outputs.transport == 'private'
        id: fetch-private
        shell: bash
        env:
          SOURCE_TRANSPORT: private
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B source-rule-tools/tools/gates/workflow.py fetch

      - name: Evaluate the source rules without credentials
        if: always() && !cancelled() && steps.trusted.outcome == 'success'
        id: evaluate
        shell: bash
        env:
          SOURCE_OBJECTS: ${{ steps.fetch-public.outputs.scratch || steps.fetch-private.outputs.scratch }}
          FETCH_REASON: ${{ steps.authorize.outputs.reason || steps.fetch-public.outputs.reason || steps.fetch-private.outputs.reason }}
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" SOURCE_OBJECTS="$SOURCE_OBJECTS" \
            FETCH_REASON="$FETCH_REASON" \
            python3 -I -S -B source-rule-tools/tools/gates/workflow.py evaluate

      - name: Report unavailable protected tools
        if: always() && !cancelled() && steps.trusted.outcome != 'success'
        shell: bash
        run: |
          echo "Expected the source checks from current protected main. Found an unavailable tools checkout or a stale base." \
            >> "$GITHUB_STEP_SUMMARY"

  publish-source-rules:
    needs: source-rules
    if: always() && !cancelled() && needs.source-rules.result == 'success'
    runs-on: ${{ (vars.BFME_PR_ORCHESTRATION_RUNNER || 'ubuntu-24.04') }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    timeout-minutes: 5
    steps:
      - name: Verify the protected tools revision
        env:
          QUEUE_READ_TOKEN: ${{ github.event_name == 'merge_group' && github.token || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected an exact protected commit. Found a missing or invalid revision." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            if [[ "${GITHUB_REPOSITORY,,}" != open-bfme/bfme2-rebuild ||
                  "$GITHUB_SERVER_URL" != https://github.com ||
                  "$GITHUB_API_URL" != https://api.github.com ]]; then
              echo "Expected the GitHub source repository. Found a different repository or service." >&2
              exit 1
            fi
            if ! main=$(curl --fail --silent --proto '=https' --connect-timeout 8 --max-time 25 \
                  --config - "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
                  <<< "header = \"Authorization: Bearer $QUEUE_READ_TOKEN\"" | jq -er '.object.sha') ||
                [[ "$SOURCE_TOOLS_SHA" != "$main" ]]; then
              echo "Expected the queued change's base to be current protected main. Found a moved or unavailable main." >&2
              exit 1
            fi
          fi

      - name: Load the source checks from protected main
        id: trusted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_TOOLS_SHA }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: tools/gates
          path: source-rule-tools

      - name: Recheck current main and publish source-rule statuses
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RULE_STATUS: ${{ needs.source-rules.outputs.decision }}
        run: python3 -I -S -B source-rule-tools/tools/gates/workflow.py publish

      - name: Retain the exact checked source-rules decision
        if: steps.publish.outcome == 'success' && (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch')
        shell: bash
        env:
          SOURCE_RULE_RECEIPT: '${{ steps.publish.outputs.receipt }}'
        run: python3 -I -S -B source-rule-tools/tools/gates/landing_receipt.py "$RUNNER_TEMP/bfme-source-receipt"
      - name: Upload the exact source-rules decision
        if: steps.publish.outcome == 'success' && (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-source-receipt-${{ github.run_attempt }}
          path: '${{ runner.temp }}/bfme-source-receipt/receipt.json'
          if-no-files-found: error
          retention-days: 7

      - name: Explain an unavailable status writer checkout
        if: always() && !cancelled() && steps.trusted.outcome != 'success'
        shell: bash
        run: |
          echo "Source results were not published because protected main moved or its tools could not be loaded." \
            >> "$GITHUB_STEP_SUMMARY"

# Workflow path refusal control.
