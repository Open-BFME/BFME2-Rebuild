name: BFME II header rules

# Writes one status, "BFME II / Header rules", for each open pull request that changes include/: the composition of
# H1-H8 (ci/header/compose.py). The landing workflow reads it only when BFME_AUTO_HEADERS is "yes". Everything runs
# on GitHub-hosted runners. The pull request's files are fetched as Git objects in a step that holds no token, and
# nothing from them is run.
on:
  # The compiler check asks for this after measuring a header change (bot-started runs start no workflow_run).
  repository_dispatch:
    types: [bfme-header-rules]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Only this pull request (empty means every open pull request that changes include/)
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  plan:
    if: github.repository == 'Open-BFME/BFME2-Rebuild' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      pulls: ${{ steps.plan.outputs.pulls }}
    steps:
      - name: Read the header rules tools from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/header
      - name: Choose the pull requests that change include/
        id: plan
        shell: bash
        env:
          BFME_HEADER_TOKEN: '${{ github.token }}'
          BFME_HEADER_PR: '${{ inputs.pr_number }}'
        run: python3 -I -B ci/header/collect.py plan

  rules:
    needs: plan
    if: needs.plan.outputs.pulls != '[]' && needs.plan.outputs.pulls != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pull: ${{ fromJSON(needs.plan.outputs.pulls) }}
    concurrency:
      group: bfme-header-rules-${{ matrix.pull.number }}
      cancel-in-progress: true
    outputs:
      passed: ${{ steps.publish.outputs.passed }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Read the header rules, the declaration reader and the source checks from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci
            tools/gates
      - name: Verify the header rules tools
        shell: bash
        run: |
          set -euo pipefail
          for dir in ci/header ci/managed-check ci/managed-nt2 ci/header-witness; do
            if [ "$dir" != ci/header ] && [ ! -f "$dir/bundle.sha256" ]; then
              continue   # the declaration reader is not on this main yet: H2 shows as not built
            fi
            if ! (cd "$dir" && sha256sum -c --quiet bundle.sha256); then
              echo "Expected every file listed in $dir/bundle.sha256 to match. Found a difference." >&2
              exit 1
            fi
          done
      - name: Check the header source rules on the pull request's Git objects (no token in this step)
        shell: bash
        env:
          PR_NUMBER: '${{ matrix.pull.number }}'
          PR_HEAD: '${{ matrix.pull.head }}'
          PR_BASE: '${{ matrix.pull.base }}'
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" RUNNER_TEMP="$RUNNER_TEMP" LANG=C \
            python3 -I -B ci/header/collect.py preview "$PR_NUMBER" "$PR_HEAD" "$PR_BASE" "$RUNNER_TEMP/header-preview.json"
      - name: Read authenticated H4/H6 header observations from Boat
        shell: bash
        env:
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
        run: python3 -I -B ci/header/collect.py trusted "$RUNNER_TEMP/header-preview.json" "$RUNNER_TEMP/header-trusted.json"
      - name: Re-evaluate H3-H8 with authenticated header observations (no token in this step)
        shell: bash
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" RUNNER_TEMP="$RUNNER_TEMP" LANG=C \
            python3 -I -B ci/header/collect.py rescore "$RUNNER_TEMP/header-preview.json" "$RUNNER_TEMP/header-trusted.json"
      - name: Compose H1-H8 and write BFME II / Header rules
        id: publish
        shell: bash
        env:
          BFME_HEADER_TOKEN: '${{ github.token }}'
          # The job's own token reads the compiler check's published H2 and H5 evidence (this job has actions: read,
          # the same token already writes the status). No repository secret supplies it: an empty value made every
          # read refuse.
          BFME_RECOVERY_READ_TOKEN: '${{ github.token }}'
        run: python3 -I -B ci/header/collect.py publish "$RUNNER_TEMP/header-preview.json"

  notify-landing:
    needs: rules
    if: >-
      always() && !cancelled() && needs.rules.result == 'success' &&
      needs.rules.outputs.passed == 'yes' &&
      github.repository_id == '1464323350' && github.ref == 'refs/heads/main' &&
      github.event_name == 'repository_dispatch' && github.actor_id == '41898282'
    name: Ask the landing workflow to look now
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Send bfme-land-next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n '{event_type: "bfme-land-next", client_payload: {}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - >/dev/null
