name: BFME II landing

# One landing job at a time for the whole repository. This job is the only
# thing that moves main: it merges a pull request only when the three checks
# passed on its exact head and were measured against the main it merges onto.
#
# Runner: both jobs only call the GitHub API and run standard-library Python. They run on a fixed GitHub-hosted
# runner; no runner variable, because outsiders can start this workflow and no such run may carry a Boat label. Runs start on a successful check completion (a failed check can make
# nothing eligible), after each landing (bfme-land-next), on the merge queue, by hand, and hourly as a backstop.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [BFME II Boat comparison, BFME II source rules]
    types: [completed]
  repository_dispatch:
    types: [bfme-land-next]
  # Only fires once main's ruleset turns on the merge queue (ci/landing/ruleset-main-queue.json).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run reports what it would do and changes nothing; live merges
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live]
      pr_number:
        description: Only consider this pull request (empty means every open pull request)
        required: false
        default: ''
        type: string

permissions: {}

# Concurrency is per job, not per workflow: a run whose job is skipped (for example a failed check's
# workflow_run) must never replace a waiting landing run.
jobs:
  group:
    if: >-
      vars.BFME_MERGE_QUEUE_ENABLED != 'yes' &&
      github.repository == 'Open-BFME/BFME2-Rebuild' && github.event_name == 'merge_group' &&
      startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: bfme-landing-group-${{ github.event.merge_group.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Read the landing tools from the queue's base (main), never from the queue commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.event.merge_group.base_sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/landing
            ci/managed-check
            ci/managed-nt2
            tools/gates
      - name: Verify the landing and receipt tools
        shell: bash
        run: |
          set -euo pipefail
          for dir in ci/landing ci/managed-check; do
            if ! (cd "$dir" && sha256sum -c --quiet bundle.sha256); then
              echo "Expected every file listed in $dir/bundle.sha256 to match. Found a difference." >&2
              exit 1
            fi
          done
      - name: Clear the queue commit only if the landing workflow queued this exact pull request head
        shell: bash
        env:
          BFME_LANDING_TOKEN: '${{ github.token }}'
        run: python3 -B ci/landing/lander.py group "$RUNNER_TEMP/bfme-landing"

  land:
    if: >-
      vars.BFME_MERGE_QUEUE_ENABLED != 'yes' &&
      github.repository == 'Open-BFME/BFME2-Rebuild' && github.ref == 'refs/heads/main' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One landing job at a time for the whole repository; a newer trigger waits, it never cancels this one.
    concurrency:
      group: bfme-landing
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
    env:
      BFME_LANDING_MODE: "${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.BFME_LANDING_MODE || 'dry-run' }}"
      BFME_LANDING_PR: "${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}"
      BFME_LANDING_CHAIN: "${{ github.event_name != 'workflow_dispatch' && '1' || '0' }}"
      # Header changes land on the header rules (H1-H8) instead of a listed approver only when this is "yes".
      BFME_AUTO_HEADERS: ${{ vars.BFME_AUTO_HEADERS }}
      # With automatic admission on, every re-measure goes through the admission workflow (it reserves first).
      BFME_AUTO_ADMISSION: ${{ vars.BFME_AUTO_ADMISSION }}
    steps:
      - name: Read the landing tools from this main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/landing
            ci/managed-check
            ci/managed-nt2
            tools/gates
      - name: Verify the landing and receipt tools
        shell: bash
        run: |
          set -euo pipefail
          for dir in ci/landing ci/managed-check; do
            if ! (cd "$dir" && sha256sum -c --quiet bundle.sha256); then
              echo "Expected every file listed in $dir/bundle.sha256 to match. Found a difference." >&2
              exit 1
            fi
          done
      - name: Choose a pull request and make sure it was measured on current main
        id: select
        shell: bash
        env:
          BFME_LANDING_TOKEN: '${{ github.token }}'
        run: python3 -B ci/landing/lander.py select "$RUNNER_TEMP/bfme-landing"
      - name: Download the match receipt
        if: steps.select.outputs.action == 'land'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: '${{ github.token }}'
          run-id: '${{ steps.select.outputs.match_run }}'
          name: bfme-report-${{ steps.select.outputs.match_attempt }}
          path: '${{ runner.temp }}/bfme-landing/match'
      - name: Download the inline virtual receipt
        if: steps.select.outputs.action == 'land' && steps.select.outputs.inline == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: '${{ github.token }}'
          run-id: '${{ steps.select.outputs.match_run }}'
          name: bfme-inline-report-${{ steps.select.outputs.match_attempt }}
          path: '${{ runner.temp }}/bfme-landing/inline'
      - name: Download the source rules receipt
        if: steps.select.outputs.action == 'land'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: '${{ github.token }}'
          run-id: '${{ steps.select.outputs.rules_run }}'
          name: bfme-source-receipt-${{ steps.select.outputs.rules_attempt }}
          path: '${{ runner.temp }}/bfme-landing/rules'
      - name: Verify receipts, re-read main, merge, verify the new main commit
        if: steps.select.outputs.action == 'land'
        shell: bash
        env:
          BFME_LANDING_TOKEN: '${{ github.token }}'
        run: python3 -B ci/landing/lander.py land "$RUNNER_TEMP/bfme-landing"
